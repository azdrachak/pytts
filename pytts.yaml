  "ВПК": "вэпэка"
  "ФСБ": "эфэсбэ"
  "МВД": "эмвэдэ"
  "МЧС": "эмчеэс"
  "РФ": "эрэф"
  "СНГ": "эсэнгэ"
  "ЕС": "еэс"
  "НДС": "эндээс"
  "ДТП": "дэтэпэ"
  "ВВП": "вэвэпэ"
  "ЖКХ": "жэкаха"
  "РЖД": "эржэдэ"
  "ПВО": "пэвэо"
