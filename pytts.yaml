version: 1

abbreviations:
  # honorifics and editorial forms
  "г-н": "господин"
  "г-жа": "госпожа"
  "ув.": ""            # ироничный тик автора — удаляем, смысл не теряется
  "им.": "имени"

  # dotted abbreviations (expansion also removes the trailing false pause)
  "т.е.": "то есть"
  "т. е.": "то есть"
  "т.д.": "так далее"
  "т. д.": "так далее"
  "т.п.": "тому подобное"
  "т. п.": "тому подобное"
  "т.к.": "так как"
  "т. к.": "так как"
  "т.н.": "так называемый"
  "т. н.": "так называемый"
  "т.ч.": "том числе"
  "т. ч.": "том числе"
  "см.": "смотри"
  "напр.": "например"
  "др.": "другие"
  "н.э.": "нашей эры"
  "н. э.": "нашей эры"
  "рис.": "рисунок"
  "табл.": "таблица"
  "обл.": "область"
  "р-н": "район"
  "х/ф": "художественный фильм"
  "з/п": "зарплата"

  # letter-spelled Cyrillic initialisms (consonant clusters Silero cannot syllabify)
  "УССР": "уэсэсэр"
  "США": "сэшэа"
  "БПЛА": "бэпээла"
  "МО": "министерство обороны"
  "ВМС": "вээмэс"
